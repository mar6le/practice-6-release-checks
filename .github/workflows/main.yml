name: Gateway qualification
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Experiment / {0}', inputs.case) || github.event.head_commit.message || github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: Failure to verify
        required: true
        type: choice
        options:
          - unit-fail
          - unavailable

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Test API and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/scenario/{0}', inputs.case) || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record source hash
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Execute pytest
        run: |
          mkdir -p evidence/verify
          python -m pip install -r requirements-qa.txt 2>&1 | tee evidence/verify/dependencies.log
          python -m pytest -q qa --junitxml=evidence/verify/api.xml 2>&1 | tee evidence/verify/api.log
      - name: Build the commit image
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$REVISION"
          docker build -t "$image" --build-arg "BUILD_REF=$REVISION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            . 2>&1 | tee evidence/verify/build.log
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            docker save "$image" | gzip -1 > gateway-image.tar.gz
          fi
      - name: Save test and build outputs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qualification
          path: evidence/verify/
          retention-days: 5
      - name: Pass built image to deployment
        uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: gateway-image
          path: gateway-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Deploy on training Linux VM
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    concurrency:
      group: gateway-training-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ needs.verify.outputs.revision }}
      HTTP_PORT: '8080'
      LOCAL_PORT: '8196'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Testinfra
        run: |
          mkdir -p evidence/deploy
          python -m pip install -r requirements-qa.txt 2>&1 | tee evidence/deploy/dependencies.log
      - uses: actions/download-artifact@v7
        with:
          name: gateway-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish candidate and check release
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input gateway-image.tar.gz 2>&1 | tee evidence/deploy/load.log
          docker push "$registry:$REVISION" 2>&1 | tee evidence/deploy/push.log
          bash ci/deploy.sh "$registry" "$REVISION" 2>&1 | tee evidence/deploy/release.log
      - name: Gather container state and clean up
        if: always()
        run: |
          mkdir -p evidence/deploy
          export GATEWAY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$REVISION"
          docker compose ps --all > evidence/deploy/final-state.log 2>&1 || true
          docker compose logs --no-color --timestamps > evidence/deploy/last-container.log 2>&1 || true
          docker compose down > evidence/deploy/cleanup.log 2>&1
      - name: Save deployment evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rollout-evidence
          path: evidence/deploy/
          retention-days: 5
