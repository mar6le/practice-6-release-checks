name: practice6-gateway-m6
services:
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE required}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8196}:${HTTP_PORT:-8080}"
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "from os import environ; from urllib.request import urlopen; urlopen('http://127.0.0.1:' + environ['HTTP_PORT'] + '/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 3s
